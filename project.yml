name: Weinkeller
options:
  bundleIdPrefix: ch.weinkeller
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    # XcodeGen setzt DEBUG nicht von selbst — ohne das ist jedes `#if DEBUG` still aus.
    debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1 $(inherited)"
    release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  Weinkeller:
    type: application
    platform: iOS
    sources:
      - Weinkeller
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 97M8QABMLM
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSCameraUsageDescription: "Zum Scannen von Weinetiketten und Barcodes. Die Fotos bleiben auf deinem Gerät."
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: ch.weinkeller.app
        SWIFT_EMIT_LOC_STRINGS: YES
        PRODUCT_NAME: Weinkeller
